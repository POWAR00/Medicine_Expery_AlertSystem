{% extends "base.html" %}
{% block content %}

<div class="page-title"><i class="bi bi-pencil-square me-2"></i>Edit Medicine</div>

<div class="card border-0 shadow-sm" style="border-radius:1rem; max-width:720px">
  <div class="card-body p-4">
    <div class="alert alert-info d-flex align-items-center gap-2 py-2 mb-4">
      <i class="bi bi-info-circle"></i>
      <span>Editing: <strong>{{ med.medicine_name }}</strong> &nbsp;|&nbsp; Batch: {{ med.batch_number }} &nbsp;|&nbsp; ID: {{ med.medicine_id }}</span>
    </div>

    <form method="post">
      <h6 class="text-uppercase text-muted fw-semibold mb-3" style="font-size:.75rem; letter-spacing:.08em">
        Medicine Details
      </h6>
      <div class="row g-3 mb-4">
        <div class="col-md-4">
          <label class="form-label fw-semibold">Quantity <span class="text-danger">*</span></label>
          <input name="quantity" type="number" min="1" class="form-control" value="{{ med.quantity }}" required/>
        </div>
        <div class="col-md-4">
          <label class="form-label fw-semibold">Price (Rs.) <span class="text-danger">*</span></label>
          <input name="price" type="number" step="0.01" min="0.01" class="form-control" value="{{ med.price }}" required/>
        </div>
        <div class="col-md-4">
          <label class="form-label fw-semibold">Expiry Date <span class="text-danger">*</span></label>
          <input name="expiry_date" type="date" class="form-control" value="{{ med.expiry_date }}" required/>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Changed By</label>
          <input name="changed_by" class="form-control" placeholder="Your name or ID"/>
        </div>
      </div>

      <hr/>
      <h6 class="text-uppercase text-muted fw-semibold mb-3" style="font-size:.75rem; letter-spacing:.08em">
        Supplier Details
      </h6>
      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Supplier Name</label>
          <input name="supplier_name" class="form-control" value="{{ sup.supplier_name or '' }}"/>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Contact Number</label>
          <input name="contact_number" class="form-control" value="{{ sup.contact_number or '' }}"/>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Email</label>
          <input name="email" type="email" class="form-control" value="{{ sup.email or '' }}"/>
        </div>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-lg me-1"></i>Save Changes</button>
        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
