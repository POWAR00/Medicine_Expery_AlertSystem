<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>MediAlert — Sign Up</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a3c5e 0%, #0d2137 60%, #132f4c 100%);
      display: flex; align-items: center; justify-content: center;
      padding: 2rem 1rem;
    }
    .signup-card {
      background: #fff; border-radius: 1.2rem;
      box-shadow: 0 8px 40px rgba(0,0,0,.35);
      width: 100%; max-width: 480px; overflow: hidden;
    }
    .signup-header {
      background: linear-gradient(135deg, #1a3c5e, #0d2137);
      padding: 1.8rem 2rem 1.4rem; text-align: center; color: #fff;
    }
    .signup-header .icon { font-size: 2.5rem; display: block; margin-bottom: .3rem; }
    .signup-header h4 { margin: 0; font-weight: 700; }
    .signup-header p  { margin: .3rem 0 0; color: rgba(255,255,255,.65); font-size: .88rem; }
    .signup-body { padding: 2rem; }
    .form-label  { font-weight: 600; font-size: .88rem; color: #333; }
    .form-control { border-radius: .6rem; padding: .65rem 1rem; }
    .form-control:focus { border-color: #1a3c5e; box-shadow: 0 0 0 .2rem rgba(26,60,94,.15); }
    .input-group-text { background: #f0f4f8; }
    .btn-signup {
      background: linear-gradient(135deg, #1a3c5e, #0d2137);
      color: #fff; border: none; border-radius: .6rem;
      padding: .7rem; font-weight: 600; font-size: 1rem;
      width: 100%; transition: opacity .2s;
    }
    .btn-signup:hover { opacity: .88; color: #fff; }
    .alert { border-radius: .6rem; font-size: .9rem; }
    .divider { border-top: 1px solid #e9ecef; margin: 1.2rem 0; }
    /* Password strength */
    #pwd-strength { height: 5px; border-radius: 3px; transition: all .3s; margin-top: 6px; }
  </style>
</head>
<body>
<div class="signup-card">
  <div class="signup-header">
    <span class="icon">💊</span>
    <h4>Create Account</h4>
    <p>Medicine Expiry &amp; Stock Alert System</p>
  </div>
  <div class="signup-body">

    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in msgs %}
        <div class="alert alert-{{ cat }} py-2">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post" id="signupForm">

      <div class="mb-3">
        <label class="form-label">Username <span class="text-danger">*</span></label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input name="username" class="form-control" placeholder="Choose a username"
                 minlength="3" required autofocus/>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Email Address <span class="text-danger">*</span></label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input name="email" type="email" class="form-control"
                 placeholder="yourname@gmail.com" required/>
        </div>
        <div class="form-text">OTP will be sent here for verification.</div>
      </div>

      <div class="mb-3">
        <label class="form-label">Mobile Number <span class="text-danger">*</span></label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-phone"></i></span>
          <input name="mobile" type="tel" class="form-control"
                 placeholder="10-digit mobile number"
                 pattern="[0-9]{10}" maxlength="10" required/>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Password <span class="text-danger">*</span></label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input name="password" type="password" class="form-control"
                 id="pwd" placeholder="Min 6 characters" minlength="6" required/>
          <button class="btn btn-outline-secondary" type="button" id="togglePwd">
            <i class="bi bi-eye" id="eyeIcon"></i>
          </button>
        </div>
        <div id="pwd-strength" style="background:#e9ecef;"></div>
      </div>

      <div class="mb-4">
        <label class="form-label">Confirm Password <span class="text-danger">*</span></label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
          <input name="confirm_password" type="password" class="form-control"
                 id="cpwd" placeholder="Re-enter password" required/>
        </div>
        <div id="pwd-match" class="form-text"></div>
      </div>

      <button type="submit" class="btn-signup">
        <i class="bi bi-envelope-check me-2"></i>Sign Up &amp; Verify Email
      </button>
    </form>

    <div class="divider"></div>
    <p class="text-center text-muted mb-0" style="font-size:.88rem;">
      Already have an account?
      <a href="{{ url_for('login') }}" class="fw-semibold text-primary">Login here</a>
    </p>
  </div>
</div>

<script>
  // Toggle password visibility
  document.getElementById('togglePwd').addEventListener('click', function() {
    const p = document.getElementById('pwd');
    const i = document.getElementById('eyeIcon');
    if (p.type === 'password') { p.type = 'text';  i.className = 'bi bi-eye-slash'; }
    else                       { p.type = 'password'; i.className = 'bi bi-eye'; }
  });

  // Password strength indicator
  document.getElementById('pwd').addEventListener('input', function() {
    const val = this.value;
    const bar = document.getElementById('pwd-strength');
    if      (val.length === 0)  { bar.style.width='0%';   bar.style.background='#e9ecef'; }
    else if (val.length < 6)    { bar.style.width='30%';  bar.style.background='#dc3545'; }
    else if (val.length < 10)   { bar.style.width='65%';  bar.style.background='#fd7e14'; }
    else                        { bar.style.width='100%'; bar.style.background='#198754'; }
  });

  // Confirm password match
  document.getElementById('cpwd').addEventListener('input', function() {
    const pwd  = document.getElementById('pwd').value;
    const info = document.getElementById('pwd-match');
    if (this.value === pwd) {
      info.textContent = 'Passwords match ✓';
      info.style.color = '#198754';
    } else {
      info.textContent = 'Passwords do not match';
      info.style.color = '#dc3545';
    }
  });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
