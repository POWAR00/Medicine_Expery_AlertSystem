<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
  <title>Create Pharmacist Account — MediAlert Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #091e3a 0%, #102a43 50%, #0b1b2b 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .auth-card {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.45);
      width: 100%;
      max-width: 500px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .auth-header {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      padding: 2rem 2rem 1.6rem;
      text-align: center;
      color: #fff;
    }

    .brand-icon {
      width: 60px;
      height: 60px;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      margin-bottom: 0.6rem;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    .auth-body {
      padding: 2rem;
    }

    .form-control {
      border-radius: 12px;
      padding: 0.72rem 1rem;
      border: 1.5px solid #e2e8f0;
      font-size: 0.92rem;
    }

    .form-control:focus {
      border-color: #10b981;
      box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
    }

    .input-group-text {
      border-radius: 12px 0 0 12px;
      border: 1.5px solid #e2e8f0;
      border-right: none;
      background: #f8fafc;
      color: #64748b;
    }

    .input-group .form-control {
      border-left: none;
    }

    .btn-auth {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 0.85rem;
      font-weight: 700;
      font-size: 1rem;
      width: 100%;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.35);
      transition: all 0.2s ease;
    }

    .btn-auth:hover {
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(16, 185, 129, 0.45);
    }

    #pwd-strength {
      height: 5px;
      border-radius: 3px;
      transition: all .3s;
      margin-top: 6px;
    }
  </style>
</head>
<body>

<div class="auth-card">
  <div class="auth-header">
    <div class="brand-icon">
      <i class="bi bi-person-plus-fill"></i>
    </div>
    <h3 class="fw-bold mb-1">Create Account</h3>
    <p class="mb-0 opacity-75 small">MediAlert Pro Clinical Pharmacy Inventory System</p>
  </div>

  <div class="auth-body">
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% if msgs %}
        {% for cat, msg in msgs %}
          <div class="alert alert-{{ cat }} alert-dismissible fade show py-2 px-3 small rounded-3" role="alert">
            <i class="bi bi-info-circle me-1"></i> {{ msg }}
            <button type="button" class="btn-close py-2" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="post" id="signupForm">
      <div class="mb-3">
        <label class="form-label fw-semibold small text-muted text-uppercase" style="letter-spacing:0.05em;">Username <span class="text-danger">*</span></label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input name="username" class="form-control" placeholder="e.g. pharmacist_john" minlength="3" required autofocus/>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold small text-muted text-uppercase" style="letter-spacing:0.05em;">Email Address <span class="text-danger">*</span></label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input name="email" type="email" class="form-control" placeholder="name@pharmacy.com" required/>
        </div>
        <div class="form-text small">Verification code will be sent to this email.</div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold small text-muted text-uppercase" style="letter-spacing:0.05em;">Mobile Number <span class="text-danger">*</span></label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-phone"></i></span>
          <input name="mobile" type="tel" class="form-control" placeholder="10-digit number" pattern="[0-9]{10}" maxlength="10" required/>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold small text-muted text-uppercase" style="letter-spacing:0.05em;">Password <span class="text-danger">*</span></label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input name="password" type="password" class="form-control" id="pwd" placeholder="Min 6 characters" minlength="6" required/>
          <button class="btn btn-outline-secondary" type="button" id="togglePwd" style="border: 1.5px solid #e2e8f0; border-left:none;">
            <i class="bi bi-eye" id="eyeIcon"></i>
          </button>
        </div>
        <div id="pwd-strength" style="background:#e2e8f0;"></div>
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold small text-muted text-uppercase" style="letter-spacing:0.05em;">Confirm Password <span class="text-danger">*</span></label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
          <input name="confirm_password" type="password" class="form-control" id="cpwd" placeholder="Re-enter password" required/>
        </div>
        <div id="pwd-match" class="form-text small"></div>
      </div>

      <button type="submit" class="btn-auth">
        <i class="bi bi-envelope-check me-2"></i>Sign Up &amp; Verify Email
      </button>
    </form>

    <div class="text-center mt-4 small border-top pt-3">
      <span class="text-muted">Already registered?</span>
      <a href="{{ url_for('login') }}" class="fw-bold text-success text-decoration-none ms-1">Login here</a>
    </div>
  </div>
</div>

<script>
  document.getElementById('togglePwd').addEventListener('click', function() {
    const p = document.getElementById('pwd');
    const i = document.getElementById('eyeIcon');
    if (p.type === 'password') { p.type = 'text'; i.className = 'bi bi-eye-slash'; }
    else { p.type = 'password'; i.className = 'bi bi-eye'; }
  });

  document.getElementById('pwd').addEventListener('input', function() {
    const val = this.value;
    const bar = document.getElementById('pwd-strength');
    if (val.length === 0) { bar.style.width='0%'; bar.style.background='#e2e8f0'; }
    else if (val.length < 6) { bar.style.width='30%'; bar.style.background='#dc2626'; }
    else if (val.length < 10) { bar.style.width='65%'; bar.style.background='#f59e0b'; }
    else { bar.style.width='100%'; bar.style.background='#10b981'; }
  });

  document.getElementById('cpwd').addEventListener('input', function() {
    const pwd = document.getElementById('pwd').value;
    const info = document.getElementById('pwd-match');
    if (this.value === pwd) {
      info.textContent = 'Passwords match ✓';
      info.style.color = '#10b981';
    } else {
      info.textContent = 'Passwords do not match';
      info.style.color = '#dc2626';
    }
  });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
