<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>MediAlert — Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a3c5e 0%, #0d2137 60%, #132f4c 100%);
      display: flex; align-items: center; justify-content: center;
    }
    .login-card {
      background: #fff;
      border-radius: 1.2rem;
      box-shadow: 0 8px 40px rgba(0,0,0,.35);
      width: 100%; max-width: 440px;
      overflow: hidden;
    }
    .login-header {
      background: linear-gradient(135deg, #1a3c5e, #0d2137);
      padding: 2rem 2rem 1.5rem;
      text-align: center; color: #fff;
    }
    .login-header .icon {
      font-size: 2.8rem; display: block; margin-bottom: .4rem;
    }
    .login-header h4 { margin: 0; font-weight: 700; letter-spacing: .03em; }
    .login-header p  { margin: .3rem 0 0; color: rgba(255,255,255,.65); font-size: .88rem; }
    .login-body { padding: 2rem; }
    .form-label  { font-weight: 600; font-size: .88rem; color: #333; }
    .form-control { border-radius: .6rem; padding: .65rem 1rem; }
    .form-control:focus { border-color: #1a3c5e; box-shadow: 0 0 0 .2rem rgba(26,60,94,.15); }
    .btn-login {
      background: linear-gradient(135deg, #1a3c5e, #0d2137);
      color: #fff; border: none; border-radius: .6rem;
      padding: .7rem; font-weight: 600; font-size: 1rem;
      width: 100%; transition: opacity .2s;
    }
    .btn-login:hover { opacity: .88; color: #fff; }
    .input-group-text { background: #f0f4f8; border-radius: .6rem 0 0 .6rem !important; }
    .alert { border-radius: .6rem; font-size: .9rem; }
  </style>
</head>
<body>
<div class="login-card">
  <div class="login-header">
    <span class="icon">💊</span>
    <h4>MediAlert System</h4>
    <p>Medicine Expiry &amp; Stock Alert</p>
  </div>
  <div class="login-body">

    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in msgs %}
        <div class="alert alert-{{ cat }} py-2">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input name="username" class="form-control" placeholder="Enter username" required autofocus/>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input name="password" type="password" class="form-control" placeholder="Enter password" required/>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label">
          Registered Mobile Number
          <span class="text-muted fw-normal">(for verification)</span>
        </label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-phone"></i></span>
          <input name="mobile" type="tel" class="form-control"
                 placeholder="e.g. 9876543210" pattern="[0-9]{10}" required/>
        </div>
        <div class="form-text">OTP will be sent to your registered email.</div>
      </div>

      <button type="submit" class="btn-login">
        <i class="bi bi-box-arrow-in-right me-2"></i>Send OTP &amp; Login
      </button>
    </form>

    <div class="text-center mt-3" style="font-size:.88rem;">
      Don't have an account?
      <a href="{{ url_for('signup') }}" class="fw-semibold text-primary">Sign Up here</a>
    </div>
    <div class="text-center mt-2 text-muted" style="font-size:.8rem;">
      <i class="bi bi-shield-lock me-1"></i>
      Secure login with OTP verification
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
